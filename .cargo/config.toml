# Serena.rs — Build configuration
#
# Default target: x86_64-unknown-linux-musl
# This produces a fully statically-linked binary with no glibc
# dependency, so it runs on ANY Linux distro regardless of libc version.
#
# To build:  cargo build --release
# To test:   cargo test --workspace --all-targets
#
# If you prefer the glibc target for local development:
#   cargo build --release --target x86_64-unknown-linux-gnu
#
[build]
target = "x86_64-unknown-linux-musl"

# For the musl target on a fresh Ubuntu/Debian, you may need:
#   sudo apt install build-essential libssl-dev pkg-config
#
# The zig linker (used via cargo-zigbuild) is not required for local dev
# if you use the glibc target above, but is used in CI to produce the
# distributable musl binary.
