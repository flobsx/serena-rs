[package]
name = "serena-memory"
version = "0.1.0"
edition = "2024"
description = "Serena.rs — Persistent memory manager (project and global memories)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
chrono = "0.4"
serena-util = { path = "../serena-util" }

[dev-dependencies]
tempfile = "3"
