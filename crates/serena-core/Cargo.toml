[package]
name = "serena-core"
version = "0.1.0"
edition = "2024"
description = "Serena.rs — Agent orchestration, modes, and agent context"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
serena-config = { path = "../serena-config" }
serena-project = { path = "../serena-project" }
serena-memory = { path = "../serena-memory" }
serena-util = { path = "../serena-util" }
