[package]
name = "serena-lsp"
version = "0.1.0"
edition = "2024"
description = "Serena.rs — LSP client, symbol retrieval, diagnostics"

[dependencies]
lsp-types = "0.95"
lsp-server = "0.7"
tokio = { version = "1", features = ["full", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
anyhow = "1"
crossbeam-channel = "0.5"
futures-util = "0.3"
serena-util = { path = "../serena-util" }
