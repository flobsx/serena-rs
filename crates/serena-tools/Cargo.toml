[package]
name = "serena-tools"
version = "0.1.0"
edition = "2024"
description = "Serena.rs — MCP tool implementations (file, symbol, memory, config, shell)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
regex = "1"
lsp-types = "0.95"
serena-lsp = { path = "../serena-lsp" }
serena-editor = { path = "../serena-editor" }
serena-project = { path = "../serena-project" }
serena-memory = { path = "../serena-memory" }
serena-config = { path = "../serena-config" }
serena-util = { path = "../serena-util" }
